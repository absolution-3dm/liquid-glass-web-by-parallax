<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter
    id="film-grain"
    x="0"
    y="0"
    width="100%"
    height="100%"
    color-interpolation-filters="sRGB"
  >
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.72"
      numOctaves="4"
      seed="19"
      stitchTiles="stitch"
      result="grain"
    />
    <feColorMatrix in="grain" type="saturate" values="0" />
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.22" exponent="1.08" offset="-0.1" />
      <feFuncG type="gamma" amplitude="1.22" exponent="1.08" offset="-0.1" />
      <feFuncB type="gamma" amplitude="1.22" exponent="1.08" offset="-0.1" />
    </feComponentTransfer>
  </filter>
  <rect width="180" height="180" fill="#808080" filter="url(#film-grain)" />
</svg>
